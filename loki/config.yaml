# Loki em modo single-binary para o ambiente local.
#
# O ponto que importa aqui e cardinalidade de labels de stream: Loki cobra caro
# por label value novo, e NAO indexa nada do conteo da linha (por isso o filtro
# de linha e lento por design, e por isso trace_id vira campo extraido no parser
# do Collector, e nao label de stream). Ver docs/custos.md.
#
#   docker compose exec loki /usr/bin/loki -check-syntax /etc/loki/config.yaml

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
  http_server_read_timeout: 60s
  http_server_write_timeout: 60s

common:
  instance_addr: loki
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

memberlist:
  bind_addr:
    - '0.0.0.0'
  bind_port: 7946
  join_address:
    - 'loki:7946'
  randomize_node_name: false

schema_config:
  configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/storage
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem

table_manager:
  retention_deletes_enabled: true
  # Retencao sintetica de 14 dias. O numero existe para mostrar a conta do
  # docs/custos.md, nao para refletir contrato real de retencao.
  retention_period: 336h

limits_config:
  ingestion_rate_strategy: global
  ingestion_rate_limit_bytes: 8388608
  ingestion_burst_size_bytes: 16777216
  max_query_series: 500
  max_query_parallelism: 4
  max_line_size: 51200
  volume_enabled: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_enabled: true
  allow_overwrite_with_line: false

query_range:
  align_queries_with_step: true
  parallelize_shardable_queries: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64

frontend:
  compress_responses: true
  log_queries_longer_than: 5s
  tail_proxy_url: http://loki:3100

query_scheduler:
  max_outstanding_requests_per_tenant: 256

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_eval_interval: 30s
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
